name: MAT Decoder V0 CPU Tests

on:
  push:
    branches: ["research/dependency-decoder-v0"]
  pull_request:
  workflow_dispatch:

jobs:
  decoder-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight test dependencies only
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 absl-py
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run action-ordering unit and real MAT smoke tests
        run: python -m unittest discover -s tests -v
      - name: Check SMAC launcher syntax and dry run (without SC2)
        run: |
          bash -n mat/scripts/train_smac_research.sh
          output="$(DRY_RUN=1 AGENT_ORDER_MODE=obs_norm bash mat/scripts/train_smac_research.sh 3m 0 1)"
          printf '%s\\n' "$output"
          grep -Fq 'agent_order_mode=obs_norm agent_order_seed=1' <<< "$output"
          grep -Fq 'repository_root=' <<< "$output"
          grep -Fq ' --agent_order_mode obs_norm ' <<< "$output"
          grep -Fq 'DRY_RUN=1: command printed; no training started.' <<< "$output"
          low_parallel_output="$(DRY_RUN=1 N_ROLLOUT_THREADS=1 N_TRAINING_THREADS=2 USE_EVAL=0 AGENT_ORDER_MODE=obs_norm bash mat/scripts/train_smac_research.sh 3m 0 1)"
          printf '%s\\n' "$low_parallel_output"
          grep -Fq 'rollout_threads=1 training_threads=2' <<< "$low_parallel_output"
          grep -Fq 'use_eval=0' <<< "$low_parallel_output"
          grep -Fq ' --n_rollout_threads 1 ' <<< "$low_parallel_output"
          if grep -q -- '--use_eval' <<< "$low_parallel_output"; then
            echo "ERROR: --use_eval found when USE_EVAL=0" >&2
            exit 1
          fi
