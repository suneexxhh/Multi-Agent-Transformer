name: MAT decoder V0 CPU unit tests

on:
  push:
    branches:
      - research/dependency-decoder-v0
    paths:
      - ".github/workflows/decoder-v0-unit.yml"
      - "mat/algorithms/**"
      - "mat/config.py"
      - "tests/test_agent_ordering.py"
  pull_request:
    paths:
      - "mat/algorithms/**"
      - "mat/config.py"
      - "tests/test_agent_ordering.py"

jobs:
  decoder-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run MAT decoder V0 unit tests
        run: |
          python -m unittest discover -s tests -p "test_agent_ordering.py" -v
